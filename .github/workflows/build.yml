# Author: Kang Lin<kl222@126.com>
# Workflow syntax: https://docs.github.com/actions/writing-workflows/workflow-syntax-for-github-actions

name: build

env:
  artifact_path: artifact_path
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  Calendar_VERSION: 1.0.26

on: 
  push:
  pull_request:

jobs:
  docker:
    uses: ./.github/workflows/docker.yml
    secrets: inherit

  msvc:
    uses: ./.github/workflows/msvc.yml
    secrets: inherit

  mingw:
    uses: ./.github/workflows/mingw.yml
    secrets: inherit

  macos:
    uses: ./.github/workflows/macos.yml
    secrets: inherit

  android:
    uses: ./.github/workflows/android.yml
    secrets: inherit

  flatpak:
    #if: ${{ ! startsWith(github.ref, 'refs/tags/') }}
    uses: ./.github/workflows/flatpak.yml
    secrets: inherit

  snap:
    #if: ${{ ! startsWith(github.ref, 'refs/tags/') }}
    uses: ./.github/workflows/snap.yml
    secrets: inherit

  deploy:
    #if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    needs: [msvc, macos, android, docker]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          submodules: false
          fetch-depth: 1

      - name: clean test tag
        if: ${{ startsWith(github.ref, 'refs/heads/master') }}
        continue-on-error: true
        run: |
          gh release delete test_${{ github.ref_name }} -y --cleanup-tag

      - name: Download docker
        uses: actions/download-artifact@v7
        with:
          pattern: ${{ needs.docker.outputs.name }}*
          path: ${{ env.artifact_path }}
          merge-multiple: true

      - name: Download flatpak
        uses: actions/download-artifact@v7
        with:
          pattern: Calendar_*.flatpak
          path: ${{ env.artifact_path }}
          merge-multiple: true

      - name: Download snap
        uses: actions/download-artifact@v7
        with:
          pattern: ${{ needs.snap.outputs.name }}*
          path: ${{ env.artifact_path }}
          merge-multiple: true

      - name: Download msvc
        uses: actions/download-artifact@v7
        with:
          pattern: ${{ needs.msvc.outputs.name }}*
          path: ${{ env.artifact_path }}
          merge-multiple: true

      - name: Download macos
        uses: actions/download-artifact@v7
        with:
          pattern: ${{ needs.macos.outputs.name }}*
          path: ${{ env.artifact_path }}
          merge-multiple: true

      - name: Download android
        uses: actions/download-artifact@v7
        with:
          pattern: ${{ needs.android.outputs.name }}*
          path: ${{ env.artifact_path }}
          merge-multiple: true

      - name: Process configure file
        run: |
          git clone https://github.com/KangLin/RabbitCommon.git
          ./RabbitCommon/Script/MergeJsonFile.sh \
              "${{ github.workspace }}/update.json" \
              "${{ env.artifact_path }}" "${{ env.artifact_path }}/version.json"
          rm ${{ env.artifact_path }}/*.json

      - name: Add change log file in Release.md file
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          RabbitCommon_ROOT: ${{github.workspace}}/RabbitCommon
        run: |
          if [ -f ${{github.workspace}}/Script/common.sh ]; then
              source ${{github.workspace}}/Script/common.sh
              content=$(<"${{github.workspace}}/ChangeLog.md")
              if [[ $content =~ "${{env.Calendar_VERSION}}" ]]; then
                echo "## :us: Change log" >> ${{github.workspace}}/Release.md
                echo "" >> ${{github.workspace}}/Release.md
                get_section ${{github.workspace}}/ChangeLog.md >> ${{github.workspace}}/Release.md
                echo "" >> ${{github.workspace}}/Release.md
              fi
              # content=$(<"${{github.workspace}}/ChangeLog_zh_CN.md")
              # if [[ $content =~ "${{env.Calendar_VERSION}}" ]]; then
              #   echo "## :cn: 修改日志" >> ${{github.workspace}}/Release.md
              #   echo "" >> ${{github.workspace}}/Release.md
              #   get_section ${{github.workspace}}/ChangeLog_zh_CN.md >> ${{github.workspace}}/Release.md
              #   echo "" >> ${{github.workspace}}/Release.md
              # fi
          fi
          echo "-------------------------" >> ${{github.workspace}}/Release.md
          # 因为其它网站也可能需要，所以用完整的 URL
          echo "|:us: English|:cn: 中文|" >> ${{github.workspace}}/Release.md
          echo "| :-    |:- |" >> ${{github.workspace}}/Release.md
          echo "|[Change log](https://github.com/KangLin/Calendar/blob/v${{env.Calendar_VERSION}}/ChangeLog.md)|[修改日志](https://github.com/KangLin/Calendar/blob/v${{env.Calendar_VERSION}}/ChangeLog_zh_CN.md)|" >> ${{github.workspace}}/Release.md
          echo "|Full Change: [${{env.Calendar_VERSION_PRE}}...v${{env.Calendar_VERSION}}](https://github.com/KangLin/Calendar/compare/${{env.Calendar_VERSION_PRE}}...v${{env.Calendar_VERSION}})|全部修改: [${{env.Calendar_VERSION_PRE}}...v${{env.Calendar_VERSION}}](https://github.com/KangLin/Calendar/compare/${{env.Calendar_VERSION_PRE}}...v${{env.Calendar_VERSION}})|" >> ${{github.workspace}}/Release.md
          BUILD_TIME=`date --rfc-3339=second`
          echo "|Build time: $BUILD_TIME|构建时间：$BUILD_TIME|" >> ${{github.workspace}}/Release.md
          echo "|Supported platforms: [Qt5](https://doc.qt.io/qt-5/supported-platforms.html) [Qt6](https://doc.qt.io/qt-6/supported-platforms.html)|支持平台: [Qt5](https://doc.qt.io/qt-5/supported-platforms.html) [Qt6](https://doc.qt.io/qt-6/supported-platforms.html)|" >> ${{github.workspace}}/Release.md
          echo "|[File checksum](https://github.com/KangLin/Calendar/releases/download/${{ github.ref_name }}/CheckSum.md)|[文件检验和](https://github.com/KangLin/Calendar/releases/download/${{ github.ref_name }}/CheckSum.md)|" >> ${{github.workspace}}/Release.md
          #echo "|[Online development document](https://Calendar.sourceforge.io/${{ github.ref_name }}/English/html/index.html)|[在线开发文档](https://Calendar.sourceforge.io/${{ github.ref_name }}/Chinese/html/index.html)|" >> ${{github.workspace}}/Release.md
          echo "" >> ${{github.workspace}}/Release.md

      - name: Add test comment in Release.md file
        if: ${{ ! startsWith(github.ref, 'refs/tags/') }}
        env:
          RabbitCommon_ROOT: ${{github.workspace}}/RabbitCommon
        run: |
          echo "**This release is for development and testing purposes only!**" >> ${{github.workspace}}/Release.md
          if [ -f ${{github.workspace}}/Script/common.sh ]; then
              source ${{github.workspace}}/Script/common.sh
              content=$(<"${{github.workspace}}/ChangeLog.md")
              if [[ $content =~ "${{env.Calendar_VERSION}}" ]]; then
                echo "## :us: Change log" >> ${{github.workspace}}/Release.md
                echo "" >> ${{github.workspace}}/Release.md
                get_section ${{github.workspace}}/ChangeLog.md >> ${{github.workspace}}/Release.md
                echo "-------------------------" >> ${{github.workspace}}/Release.md
              fi
          fi
          echo "" >> ${{github.workspace}}/Release.md
          echo "Commit: [${{github.sha}}](https://github.com/KangLin/Calendar/commit/${{github.sha}})" >> ${{github.workspace}}/Release.md
          echo "" >> ${{github.workspace}}/Release.md
          echo "Build time: `date --rfc-3339=second`" >> ${{github.workspace}}/Release.md
          echo "" >> ${{github.workspace}}/Release.md
          echo "[:us: Change log](https://github.com/KangLin/Calendar/blob/test_${{ github.ref_name }}/ChangeLog.md)" >> ${{github.workspace}}/Release.md
          echo "" >> ${{github.workspace}}/Release.md
          echo "[File checksum](https://github.com/KangLin/Calendar/releases/download/test_${{ github.ref_name }}/CheckSum.md)" >> ${{github.workspace}}/Release.md
          echo "" >> ${{github.workspace}}/Release.md

      - name: Add download
        run: |
          export BRANCH_NAME="${{ github.ref_name }}"
          if [ "${{ github.ref_name }}" = "master" ]; then
              export BRANCH_NAME="test_${{ github.ref_name }}"
          fi
          echo "## Download:" >> ${{github.workspace}}/Release.md
          echo "" >> ${{github.workspace}}/Release.md
          echo "|       | x86-64 (64-bit) | x86-32 (32-bit) | AArch64 (ARM64) | ARMv7 (32-bit) |:us: Comment|:cn: 备注|" >> ${{github.workspace}}/Release.md
          echo "|:-     | :-------------- | :-------------- | :-------------- | :------------- |:-----------|:--------|" >> ${{github.workspace}}/Release.md
          echo "|Windows|[EXE](https://github.com/KangLin/Calendar/releases/download/${BRANCH_NAME}/Calendar_v${{env.Calendar_VERSION}}_win64_msvc2022_64_qt6.10.3.exe)|[EXE](https://github.com/KangLin/Calendar/releases/download/${BRANCH_NAME}/Calendar_v${{env.Calendar_VERSION}}_win32_msvc2017_qt5.15.2.exe)|[EXE](https://github.com/KangLin/Calendar/releases/download/${BRANCH_NAME}/Calendar_v${{env.Calendar_VERSION}}_win64_msvc2022_arm64_qt6.10.3.exe)| |Supported platforms:<br> [x86-32(Qt5)](https://doc.qt.io/qt-5/supported-platforms.html)<br> [x86-64(Qt6)](https://doc.qt.io/qt-6/supported-platforms.html)|支持平台：<br> [x86-32(Qt5)](https://doc.qt.io/qt-5/supported-platforms.html)<br> [x86-64(Qt6)](https://doc.qt.ac.cn/qt-6/supported-platforms.html)|" >> ${{github.workspace}}/Release.md
          echo "|Android|[APK](https://github.com/KangLin/Calendar/releases/download/${BRANCH_NAME}/Calendar_v${{env.Calendar_VERSION}}_android_x86_64_qt6.10.3_Release.apk)| |[APK](https://github.com/KangLin/Calendar/releases/download/${BRANCH_NAME}/Calendar_v${{env.Calendar_VERSION}}_android_arm64_v8a_qt6.10.3_Release.apk)| | | |" >> ${{github.workspace}}/Release.md
          echo "|Linux|[zip file of install AppImage](https://github.com/KangLin/Calendar/releases/download/${BRANCH_NAME}/Calendar_${{env.Calendar_VERSION}}_Linux_x86_64_Setup.zip)| |[zip file of install AppImage](https://github.com/KangLin/Calendar/releases/download/${BRANCH_NAME}/Calendar_${{env.Calendar_VERSION}}_Linux_aarch64_Setup.zip)| |Unzip the zip file, then execute \`install.sh [--auto-start]\` to install shortcuts for application, links, and directories in graphical user interfaces (GUIs), or execute \`Calendar_${{env.Calendar_VERSION}}_Linux_*.AppImage\` to run program in the terminal.<br>NOTE: \`GLIBC >= 2.39\` and installed \`fuse\`|解压 zip 文件，然后执行  \`install.sh [--auto-start]\`， 安装用于图形界面的目录、桌面快捷方式；或者在终端中执行  \`Calendar_${{env.Calendar_VERSION}}_Linux_*.AppImage\`  文件，运行程序。<br>注意：\`GLIBC >= 2.39\` 并且安装了 \`fuse\`|" >> ${{github.workspace}}/Release.md
          echo "|Ubuntu 26.04 (resolute)|[DEB](https://github.com/KangLin/Calendar/releases/download/${BRANCH_NAME}/rabbitcalendar_${{env.Calendar_VERSION}}_ubuntu26.04_x86_64.deb)| |[DEB](https://github.com/KangLin/Calendar/releases/download/${BRANCH_NAME}/rabbitcalendar_${{env.Calendar_VERSION}}_ubuntu26.04_aarch64.deb)| | Run \`sudo apt install ./rabbitcalendar_*.deb\` to install it. | 运行命令 \`sudo apt install ./rabbitcalendar_*.deb\` 进行安装。 |" >> ${{github.workspace}}/Release.md
          echo "|Ubuntu 24.04 (noble)|[DEB](https://github.com/KangLin/Calendar/releases/download/${BRANCH_NAME}/rabbitcalendar_${{env.Calendar_VERSION}}_ubuntu24.04_x86_64.deb)| |[DEB](https://github.com/KangLin/Calendar/releases/download/${BRANCH_NAME}/rabbitcalendar_${{env.Calendar_VERSION}}_ubuntu24.04_aarch64.deb)| | Run \`sudo apt install ./rabbitcalendar_*.deb\` to install it.|运行命令 \`sudo apt install ./rabbitcalendar_*.deb\` 进行安装。 |" >> ${{github.workspace}}/Release.md
          echo "|Debian 13 (trixie)|[DEB](https://github.com/KangLin/Calendar/releases/download/${BRANCH_NAME}/rabbitcalendar_${{env.Calendar_VERSION}}_debian13_x86_64.deb)| |[DEB](https://github.com/KangLin/Calendar/releases/download/${BRANCH_NAME}/rabbitcalendar_${{env.Calendar_VERSION}}_debian13_aarch64.deb)| | Run \`sudo apt install ./rabbitcalendar_*.deb\` to install it.|运行命令 \`sudo apt install ./rabbitcalendar_*.deb\` 进行安装。 |" >> ${{github.workspace}}/Release.md
          echo "|Debian 12 (Bookworm)|[DEB](https://github.com/KangLin/Calendar/releases/download/${BRANCH_NAME}/rabbitcalendar_${{env.Calendar_VERSION}}_debian12_x86_64.deb)| |[DEB](https://github.com/KangLin/Calendar/releases/download/${BRANCH_NAME}/rabbitcalendar_${{env.Calendar_VERSION}}_debian12_aarch64.deb)| | Run \`sudo apt install ./rabbitcalendar_*.deb\` to install it.|运行命令 \`sudo apt install ./rabbitcalendar_*.deb\` 进行安装。 |" >> ${{github.workspace}}/Release.md
          echo "|Fedora 41|[RPM](https://github.com/KangLin/Calendar/releases/download/${BRANCH_NAME}/rabbitcalendar-${{env.Calendar_VERSION}}-1.fc41.x86_64.rpm)| |[RPM](https://github.com/KangLin/Calendar/releases/download/${BRANCH_NAME}/rabbitcalendar-${{env.Calendar_VERSION}}-1.fc41.aarch64.rpm)| | Run \`sudo dnf install ./rabbitcalendar-*.rpm\` to install it.|运行命令 \`sudo dnf install ./rabbitcalendar-*.rpm\` 进行安装。 |" >> ${{github.workspace}}/Release.md
          echo "|macOS  || |[zip](https://github.com/KangLin/Calendar/releases/download/${BRANCH_NAME}/Calendar_${{env.Calendar_VERSION}}_macos-15.zip)| | uzip file|解压zip文件 |" >> ${{github.workspace}}/Release.md

      - name: Add download for test
        #if: false # ${{ ! startsWith(github.ref, 'refs/tags/') }}
        run: |
          export BRANCH_NAME=${{ github.ref_name }}
          if [ "${{ github.ref_name }}" = "master" ]; then
              export BRANCH_NAME=test_${{ github.ref_name }}
          fi
          echo "|Flatpak|[flatpak](https://github.com/KangLin/Calendar/releases/download/${BRANCH_NAME}/Calendar_v${{env.Calendar_VERSION}}_x86_64.flatpak)| |[flatpak](https://github.com/KangLin/Calendar/releases/download/${BRANCH_NAME}/Calendar_v${{env.Calendar_VERSION}}_aarch64.flatpak)| |Works on all operating systems that support Flatpak.<br>Run \`flatpak install \"flatpak File\" [--user]\` to install it.|适用所有支持 Flatpak 的操作系统。<br> 执行命令  \`flatpak install \"flatpak File\" [--user]\`  进行安装。|" >> ${{github.workspace}}/Release.md
          echo "|Snap|[snap](https://github.com/KangLin/Calendar/releases/download/${BRANCH_NAME}/rabbit-calendar_${{env.Calendar_VERSION}}_amd64.snap)| |[snap](https://github.com/KangLin/Calendar/releases/download/${BRANCH_NAME}/rabbit-calendar_${{env.Calendar_VERSION}}_arm64.snap)| |Works on all operating systems that support Snap.<br>Run \`snap install \"snap File\"\` to install it.|适用所有支持 Snap 的操作系统。<br> 执行命令  \`snap install \"snap File\"\`  进行安装。|" >> ${{github.workspace}}/Release.md

      - name: Add snap and flathub donwload in Release.md file
        run: |
          export BRANCH_NAME=${{ github.ref_name }}
          if [ "${{ github.ref_name }}" = "master" ]; then
            export BRANCH_NAME=test_${{ github.ref_name }}
          fi
          echo "" >> ${{github.workspace}}/Release.md
          echo "[![rabbit-calendar](https://snapcraft.io/rabbit-calendar/badge.svg)](https://snapcraft.io/rabbit-calendar)" >> ${{github.workspace}}/Release.md
          echo "" >> ${{github.workspace}}/Release.md

      - name: Make note file
        run: |
          echo "" >> ${{github.workspace}}/Release.md
          echo "File checksum:" >> ${{github.workspace}}/CheckSum.md
          echo "|File|Checksum(md5)|" >> ${{github.workspace}}/CheckSum.md
          echo "| :- |    :-       |" >> ${{github.workspace}}/CheckSum.md
          cd ${{ env.artifact_path }}
          for file in *
          do
            echo "$file"
            if [ -f $file ]; then
                if [ "${file##*.}" != "xml" ] && [ "${file##*.}" != "json" ]; then
                    SumMd5=`md5sum $file | awk '{print  "|", $2, "|", $1, "|"}'`
                    Sum256=`sha256sum $file | awk '{print $1, "|"}'`
                    echo "${SumMd5}${Sum256}" >> ${{github.workspace}}/CheckSum.md
                fi
            else
               rm -fr $file
            fi
          done

      - name: Upload To Github Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          gh release create ${{ github.ref_name }} --title ${{ github.ref_name }} --notes-file ${{github.workspace}}/Release.md
          gh release upload ${{ github.ref_name }} ${{github.workspace}}/${{ env.artifact_path }}/* ${{github.workspace}}/Release.md ${{github.workspace}}/CheckSum.md

      - name: Upload test tag To Github Release
        if: ${{ startsWith(github.ref, 'refs/heads/master') }}
        run: |
          gh release create test_${{ github.ref_name }} --prerelease --latest=false --title "Recently developed build - test_${{ github.ref_name }}" --notes-file ${{github.workspace}}/Release.md
          gh release upload test_${{ github.ref_name }} --clobber ${{github.workspace}}/${{ env.artifact_path }}/* ${{github.workspace}}/Release.md ${{github.workspace}}/CheckSum.md
